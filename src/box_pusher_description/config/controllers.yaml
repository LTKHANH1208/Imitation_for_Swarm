/**/controller_manager:
  ros__parameters:
    update_rate: 100
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

/**/diff_drive_controller:
  ros__parameters:
    left_wheel_names: ["left_wheel_joint"]
    right_wheel_names: ["right_wheel_joint"]

    wheel_separation: 0.23
    wheel_radius: 0.055
    wheel_separation_multiplier: 1.0
    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: 1.0

    # Jazzy diff_drive_controller consumes TwistStamped on ~/cmd_vel.
    use_stamped_vel: true
    position_feedback: true
    open_loop: false
    cmd_vel_timeout: 0.5

    odom_frame_id: "odom"
    base_frame_id: "base_footprint"
    enable_odom_tf: true
    tf_frame_prefix_enable: false

    publish_rate: 50.0
    velocity_rolling_window_size: 10
    publish_limited_velocity: true

    pose_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]

    linear.x.has_velocity_limits: true
    linear.x.max_velocity: 0.35
    linear.x.min_velocity: -0.35
    linear.x.has_acceleration_limits: true
    linear.x.max_acceleration: 0.60
    linear.x.max_deceleration: -0.60

    angular.z.has_velocity_limits: true
    angular.z.max_velocity: 2.0
    angular.z.min_velocity: -2.0
    angular.z.has_acceleration_limits: true
    angular.z.max_acceleration: 2.5
    angular.z.max_deceleration: -2.5
