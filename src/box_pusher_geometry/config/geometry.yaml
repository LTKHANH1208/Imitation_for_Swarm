orange_box_geometry_node:
  ros__parameters:
    use_sim_time: true
    image_topic: /robot1/stereo/left/image_rect
    depth_topic: /robot1/stereo/depth
    mask_topic: /robot1/perception/orange_boxes/mask
    camera_info_topic: /robot1/stereo/left/camera_info_rect
    camera_frame: left_camera_optical_frame
    base_frame: base_footprint
    sync_slop_sec: 0.08
    queue_size: 8
    max_rate_hz: 5.0
    box_xy_size_m: 0.08
    box_height_m: 0.10
    min_depth_m: 0.20
    max_depth_m: 5.0
    min_area_px: 120.0
    erode_kernel: 3
    min_points: 18
    max_points_per_detection: 800
    plane_threshold_m: 0.008
    max_normal_abs_z: 0.35
    ransac_iterations: 160
    min_face_width_m: 0.018
    max_face_width_m: 0.14
    tracks_topic: /robot1/perception/orange_boxes/tracks
    odom_topic: /robot1/diff_drive_controller/odom
    track_match_gate_m: 0.30
    max_track_sync_sec: 0.30
    max_odom_sync_sec: 0.15
    odom_history_size: 300
    tf_timeout_sec: 0.06
    geometry_topic: /robot1/perception/orange_boxes/geometry
    poses_topic: /robot1/perception/orange_boxes/geometry/poses
    markers_topic: /robot1/perception/orange_boxes/geometry/markers
    overlay_topic: /robot1/perception/orange_boxes/geometry/overlay
    metrics_topic: /robot1/perception/orange_boxes/geometry/metrics
    ready_topic: /robot1/perception/orange_boxes/geometry/ready
